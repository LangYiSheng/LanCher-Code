# 供应商和模型的 ID 创建后保持稳定，显示名称可以随时修改。
providers:
  deepseek:
    name: DeepSeek
    # 可选: openai | claude（界面显示为 Anthropic）
    protocol: openai
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY}
    timeout_seconds: 60
    models:
      chat:
        model_name: deepseek-chat
        display_name: 日常编程
        # 未填写的连接参数继承供应商。
      reasoner:
        model_name: deepseek-reasoner
        # 未填显示名时显示 deepseek-reasoner (DeepSeek)。
        timeout_seconds: 120
  gateway:
    name: 自定义网关
    protocol: openai
    base_url: https://your-gateway.example/v1
    api_key: ${GATEWAY_API_KEY}
    models:
      main:
        model_name: your-openai-compatible-model
        context_window: 128000
      anthropic:
        model_name: your-anthropic-compatible-model
        display_name: 网关 Anthropic 模型
        # 每个字段可以单独覆盖，删除该字段或写 null 即恢复继承。
        protocol: claude
        base_url: https://your-anthropic-gateway.example/v1
        api_key: ${ANTHROPIC_GATEWAY_API_KEY}
        context_window: 200000
        thinking:
          enabled: false
          budget_tokens: 2048

# 新会话默认主模型；/model 切换当前会话不会修改这里。
default_model: deepseek/chat

ui:
  theme: dark # dark | light
  busy_enter_action: follow_up # follow_up 排到下一轮 | steer 补充当前任务 | draft 保留草稿
  show_timestamps: false
  show_thinking_status: true

runtime:
  tool_loop_limit: 50
  unknown_tool_streak_limit: 3
  work_phase: execute # discuss | plan | execute
  permission_policy: default # default | acceptEdits | bypass，独立于工作阶段

# 调度额度和进程额度分别控制；日志写到各自 Session 的 processes 目录。
execution:
  limits:
    max_concurrency: 8
    max_processes: 32
    max_processes_per_session: 8
    output_limit_bytes: 104857600
    max_read_chars: 16000
    stop_grace_seconds: 1.0
    drain_timeout_seconds: 3.0
  # 只有你填写的命令约定才会缩小资源范围；未知命令仍独占项目。
  # 约定不限制 Shell 实际副作用，建议精确匹配已知脚本。
  command_profiles: []
  # 示例（确定脚本只写 .cache 且监听 5173 后再启用）：
  # - name: 开发服务
  #   command_match: npm run dev
  #   resources:
  #     - {kind: path, key: .cache, mode: exclusive, recursive: true}
  #     - {kind: external, key: 'port:5173', mode: exclusive}
  #   readiness: {kind: tcp, host: 127.0.0.1, port: 5173, timeout_ms: 30000}
